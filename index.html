<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>game-insights</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --paper: #fafaf9;
      --accent: #9a3412;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--paper);
    }

    main {
      max-width: 38rem;
      margin: 0 auto;
      padding: 18vh 1.5rem 4rem;
    }

    p {
      margin: 0;
      line-height: 1.5;
    }

    .mark {
      font-family: "Segoe UI", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0.6rem 0 1rem;
      font-size: 2.75rem;
      font-weight: normal;
      letter-spacing: -0.03em;
    }

    .summary {
      font-size: 1.25rem;
      color: var(--muted);
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      font-family: "Segoe UI", sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      text-decoration: none;
    }

    a:hover { border-bottom-color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="mark">Vida</p>
    <h1>game-insights</h1>
    <p class="summary">Skills to help AI agents provide insights based on game analytics.</p>
    <a href="https://github.com/vidatg/game-insights">View the repository</a>
  </main>
</body>
</html>
